name: Build and Release InstallVibe

# Trigger on version tags or manual dispatch
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string

env:
  SOLUTION_PATH: 'InstallVibe.sln'
  PACKAGE_PROJECT: 'InstallVibe.Package/InstallVibe.Package.wapproj'
  CONFIGURATION: 'Release'
  PLATFORMS: 'x64|ARM64'
  DOTNET_VERSION: '7.0.x'

jobs:
  # ============================================================================
  # Build Job - Compile and Package
  # ============================================================================
  build:
    name: Build MSIX Package
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, ARM64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for versioning

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: |
          dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Update version number
        shell: pwsh
        run: |
          # Get version from tag or workflow input
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ github.event.inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          }

          Write-Host "Setting version to: $version"

          # Update Package.appxmanifest
          $manifestPath = "InstallVibe.Package/Package.appxmanifest"
          $manifest = Get-Content $manifestPath -Raw
          $manifest = $manifest -replace 'Version="[\d\.]+"', "Version=`"$version.0`""
          Set-Content $manifestPath $manifest

          # Update appinstaller
          $installerPath = "InstallVibe.Package/InstallVibe.appinstaller"
          if (Test-Path $installerPath) {
            $installer = Get-Content $installerPath -Raw
            $installer = $installer -replace 'Version="[\d\.]+"', "Version=`"$version.0`""
            Set-Content $installerPath $installer
          }

          # Set environment variable for later steps
          echo "PACKAGE_VERSION=$version.0" >> $env:GITHUB_ENV

      - name: Build MSIX Package
        run: |
          msbuild ${{ env.PACKAGE_PROJECT}} `
            /p:Configuration=${{ env.CONFIGURATION }} `
            /p:Platform=${{ matrix.platform }} `
            /p:AppxBundle=Never `
            /p:AppxPackageDir=AppPackages\ `
            /p:GenerateAppInstallerFile=False `
            /p:AppxPackageSigningEnabled=False `
            /restore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: msix-package-${{ matrix.platform }}
          path: |
            InstallVibe.Package/AppPackages/**/*.msix
            InstallVibe.Package/AppPackages/**/*.msixupload
          retention-days: 7

  # ============================================================================
  # Sign Job - Code Sign Packages
  # ============================================================================
  sign:
    name: Sign MSIX Packages
    runs-on: windows-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: msix-package-x64
          path: artifacts/x64

      - name: Download ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: msix-package-ARM64
          path: artifacts/ARM64

      - name: Decode signing certificate
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          # Decode certificate from base64 secret
          $certBytes = [Convert]::FromBase64String($env:CERT_BASE64)
          $certPath = Join-Path $env:TEMP "signing_cert.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          echo "CERT_PATH=$certPath" >> $env:GITHUB_ENV

      - name: Sign x64 package
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          $package = Get-ChildItem -Path artifacts/x64 -Filter *.msix -Recurse | Select-Object -First 1
          .\Scripts\Sign-MSIX.ps1 `
            -PackagePath $package.FullName `
            -CertificatePath $env:CERT_PATH `
            -CertificatePassword $env:CERT_PASSWORD

      - name: Sign ARM64 package
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          $package = Get-ChildItem -Path artifacts/ARM64 -Filter *.msix -Recurse | Select-Object -First 1
          .\Scripts\Sign-MSIX.ps1 `
            -PackagePath $package.FullName `
            -CertificatePath $env:CERT_PATH `
            -CertificatePassword $env:CERT_PASSWORD

      - name: Clean up certificate
        if: always()
        shell: pwsh
        run: |
          if (Test-Path $env:CERT_PATH) {
            Remove-Item $env:CERT_PATH -Force
          }

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: msix-packages-signed
          path: artifacts/**/*.msix
          retention-days: 90

  # ============================================================================
  # Bundle Job - Create Multi-Architecture Bundle
  # ============================================================================
  bundle:
    name: Create MSIX Bundle
    runs-on: windows-latest
    needs: sign
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download signed packages
        uses: actions/download-artifact@v4
        with:
          name: msix-packages-signed
          path: signed-packages

      - name: Create MSIX Bundle
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $bundleName = "InstallVibe_${version}_bundle.msixbundle"

          # Use makeappx to create bundle
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\**\x64\makeappx.exe" | Select-Object -First 1

          & $makeappx bundle /d signed-packages /p $bundleName /bv $version.0

          echo "BUNDLE_PATH=$bundleName" >> $env:GITHUB_ENV

      - name: Sign bundle
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          # Decode certificate
          $certBytes = [Convert]::FromBase64String($env:CERT_BASE64)
          $certPath = Join-Path $env:TEMP "signing_cert.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)

          # Sign bundle
          .\Scripts\Sign-MSIX.ps1 `
            -PackagePath $env:BUNDLE_PATH `
            -CertificatePath $certPath `
            -CertificatePassword $env:CERT_PASSWORD

          # Clean up
          Remove-Item $certPath -Force

      - name: Generate App Installer file
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $bundleName = "InstallVibe_${version}_bundle.msixbundle"

          # Update appinstaller with correct URLs
          # In production, replace with your actual CDN/hosting URL
          $updateUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"

          $appInstaller = Get-Content "InstallVibe.Package/InstallVibe.appinstaller" -Raw
          $appInstaller = $appInstaller -replace 'Version="[\d\.]+"', "Version=`"$version.0`""
          $appInstaller = $appInstaller -replace 'Uri="[^"]*InstallVibe\.appinstaller"', "Uri=`"$updateUrl/InstallVibe.appinstaller`""
          $appInstaller = $appInstaller -replace 'Uri="[^"]*\.msixbundle"', "Uri=`"$updateUrl/$bundleName`""

          Set-Content "InstallVibe.appinstaller" $appInstaller

      - name: Upload bundle and installer
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: |
            *.msixbundle
            InstallVibe.appinstaller

  # ============================================================================
  # Release Job - Create GitHub Release
  # ============================================================================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: bundle
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/*.msixbundle
            release/InstallVibe.appinstaller
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # Deploy Job - Upload to CDN (Optional)
  # ============================================================================
  deploy:
    name: Deploy to CDN
    runs-on: ubuntu-latest
    needs: bundle
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # Uncomment and configure for automatic CDN deployment

    steps:
      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release

